<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ecpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Circular Shield Base -->
  <rect width="120" height="120" rx="30" fill="#030712" />
  <rect x="3" y="3" width="114" height="114" rx="27" fill="none" stroke="url(#ecpGradient)" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Shield Core Backdrop -->
  <path d="M60 16 L94 30 V60 C94 82 79 100 60 106 C41 100 26 82 26 60 V30 Z" fill="#0f172a" stroke="url(#ecpGradient)" stroke-width="2" />

  <!-- Stylized ECP Monogram -->
  <!-- Letter E (Left spine & bars) -->
  <path d="M42 42 H56 M42 56 H53 M42 70 H56 M42 40 V72" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter C (Center Curvature wrapping P) -->
  <path d="M66 43 C61 43 57 48 57 56 C57 64 61 69 67 69" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

  <!-- Letter P (Right Loop & Stem) -->
  <path d="M72 42 V70 M72 42 H81 C85 42 88 45 88 49 C88 53 85 56 72 56" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Agentic Spark Dot -->
  <circle cx="60" cy="94" r="3" fill="#38bdf8" filter="url(#glow)" />
</svg>
